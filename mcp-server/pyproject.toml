[project]
name = "remora-mcp"
version = "0.1.0"
description = "MCP-коннектор к агентскому JSON API Remora (https://remora.com.ru/)"
requires-python = ">=3.12"
dependencies = [
    "mcp>=1.28,<2",
    "httpx>=0.28.1",
    "pydantic>=2.10.5",
]

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "fastapi>=0.115.6",
    "uvicorn>=0.34.0",
    "ruff>=0.9.2",
    "mypy>=1.14.1",
]

[project.scripts]
remora-mcp = "remora_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/remora_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
